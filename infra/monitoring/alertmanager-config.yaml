apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-aditi-stays
  namespace: aditi-stays
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: ops-default
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 2h

    receivers:
      - name: ops-default
        webhook_configs:
          - url: "https://hooks.slack.com/services/REPLACE/SLACK/WEBHOOK"
            send_resolved: true
