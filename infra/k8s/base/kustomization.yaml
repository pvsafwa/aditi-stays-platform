apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aditi-stays
resources:
  - namespace.yaml
  - configmap.yaml
  - secrets.template.yaml
  - core-api.yaml
  - chat-service.yaml
  - frontend.yaml
  - ingress.yaml
  - pdb.yaml
configMapGenerator:
  - name: aditi-db-bootstrap
    files:
      - init.sql=db-bootstrap.sql
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: frontend
    newName: frontend
    newTag: latest
  - name: core-api
    newName: core-api
    newTag: latest
  - name: chat-service
    newName: chat-service
    newTag: latest
