services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aditi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (see .env.example)}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aditi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Fixes the issuer Keycloak stamps into every token/discovery doc to one
      # canonical value, regardless of whether the request came in over the
      # docker-network hostname (backend services) or localhost (browser,
      # local-toolchain services) -- without this, a JWT's iss claim depends
      # on which hostname the caller used, and a single resource-server
      # config can't validate tokens obtained via both paths.
      KC_HOSTNAME: http://localhost:8180
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  catalog-service:
    build: ./catalog-service
    environment:
      APP_PORT: "8081"
      DATABASE_URL: postgres://aditi:${POSTGRES_PASSWORD}@postgres:5432/catalog_db?sslmode=disable
      OIDC_ISSUER_URI: http://localhost:8180/realms/aditi-stays
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/aditi-stays/protocol/openid-connect/certs
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - "8081:8081"

  crm-service:
    build: ./crm-service
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://aditi:${POSTGRES_PASSWORD}@postgres:5432/crm_db?sslmode=disable
      REDIS_ADDR: redis:6379
      USER_CHAT_TOKEN_SECRET: ${USER_CHAT_TOKEN_SECRET:?set USER_CHAT_TOKEN_SECRET (see .env.example)}
      CATALOG_SERVICE_URL: http://catalog-service:8081
      CHAT_SERVICE_URL: http://chat-service:8000
      OIDC_ISSUER_URI: http://localhost:8180/realms/aditi-stays
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/aditi-stays/protocol/openid-connect/certs
      OIDC_TOKEN_URI: http://keycloak:8080/realms/aditi-stays/protocol/openid-connect/token
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?set KEYCLOAK_CLIENT_SECRET (see .env.example)}
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      catalog-service:
        condition: service_started
      jaeger:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - "8080:8080"

  chat-service:
    build: ./chat-service
    environment:
      APP_PORT: "8000"
      DATABASE_URL: postgresql+asyncpg://aditi:${POSTGRES_PASSWORD}@postgres:5432/chat_db
      REDIS_URL: redis://redis:6379/0
      ADMIN_CHAT_TOKEN: ${ADMIN_CHAT_TOKEN:?set ADMIN_CHAT_TOKEN (see .env.example)}
      USER_CHAT_TOKEN_SECRET: ${USER_CHAT_TOKEN_SECRET}
      CRM_SERVICE_URL: http://crm-service:8080
      PUBLIC_BASE_URL: http://localhost:8000
      OIDC_ISSUER_URI: http://localhost:8180/realms/aditi-stays
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/aditi-stays/protocol/openid-connect/certs
      OIDC_TOKEN_URI: http://keycloak:8080/realms/aditi-stays/protocol/openid-connect/token
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - chat-uploads:/app/uploads

  gateway:
    build: ./gateway
    environment:
      APP_PORT: "8090"
      CATALOG_SERVICE_URL: http://catalog-service:8081
      CRM_SERVICE_URL: http://crm-service:8080
      CHAT_SERVICE_URL: http://chat-service:8000
      CHAT_SERVICE_WS_URL: ws://chat-service:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      OIDC_ISSUER_URI: http://localhost:8180/realms/aditi-stays
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/aditi-stays/protocol/openid-connect/certs
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      - catalog-service
      - crm-service
      - chat-service
    ports:
      - "8090:8090"

volumes:
  postgres-data:
  chat-uploads:
