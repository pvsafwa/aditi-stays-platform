name: GitOps Deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "infra/k8s/base/**"
      - "infra/k8s/argocd/application.yaml"

concurrency:
  group: gitops-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      deploy_enabled: ${{ steps.check.outputs.deploy_enabled }}
      argocd_enabled: ${{ steps.check.outputs.argocd_enabled }}
    steps:
      - name: Check required GitHub secrets
        id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          CHAT_DOMAIN: ${{ secrets.CHAT_DOMAIN }}
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          missing_core=()
          for name in AWS_ROLE_ARN AWS_REGION ECR_REGISTRY BASE_DOMAIN API_DOMAIN CHAT_DOMAIN; do
            if [ -z "${!name}" ]; then
              missing_core+=("$name")
            fi
          done

          if [ "${#missing_core[@]}" -gt 0 ]; then
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo ""
              echo "The deploy workflow is configured, but these required repository secrets are missing:"
              for item in "${missing_core[@]}"; do
                echo "- \`$item\`"
              done
              echo ""
              echo "Configure the secrets in GitHub repository settings, then rerun this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
            echo "### Deploy prerequisites present" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${ARGOCD_SERVER:-}" ] && [ -n "${ARGOCD_AUTH_TOKEN:-}" ]; then
            echo "argocd_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "argocd_enabled=false" >> "$GITHUB_OUTPUT"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "ArgoCD sync will be skipped because \`ARGOCD_SERVER\` or \`ARGOCD_AUTH_TOKEN\` is missing." >> "$GITHUB_STEP_SUMMARY"
          fi

  build-and-push:
    needs: preflight
    if: needs.preflight.outputs.deploy_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        service: [frontend, core-api, chat-service]

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/${{ matrix.service }}:$IMAGE_TAG ./${{ matrix.service }}
          docker push $ECR_REGISTRY/${{ matrix.service }}:$IMAGE_TAG

  update-k8s-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update image tags and domains
        env:
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
          IMAGE_TAG: ${{ github.sha }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          CHAT_DOMAIN: ${{ secrets.CHAT_DOMAIN }}
          GITOPS_REPO_URL: ${{ secrets.GITOPS_REPO_URL }}
        run: |
          set -euo pipefail

          sed -Ei "s|image: .*frontend.*|image: $ECR_REGISTRY/frontend:$IMAGE_TAG|" infra/k8s/base/frontend.yaml
          sed -Ei "s|image: .*core-api.*|image: $ECR_REGISTRY/core-api:$IMAGE_TAG|" infra/k8s/base/core-api.yaml
          sed -Ei "s|image: .*chat-service.*|image: $ECR_REGISTRY/chat-service:$IMAGE_TAG|" infra/k8s/base/chat-service.yaml

          sed -Ei '/name: NEXT_PUBLIC_CORE_API_URL/{n;s|value: ".*"|value: "https:\/\/'"$API_DOMAIN"'"|;}' infra/k8s/base/frontend.yaml
          sed -Ei '/name: NEXT_PUBLIC_CHAT_HTTP_URL/{n;s|value: ".*"|value: "https:\/\/'"$CHAT_DOMAIN"'"|;}' infra/k8s/base/frontend.yaml
          sed -Ei '/name: NEXT_PUBLIC_CHAT_WS_URL/{n;s|value: ".*"|value: "wss:\/\/'"$CHAT_DOMAIN"'"|;}' infra/k8s/base/frontend.yaml
          sed -Ei '/name: PUBLIC_BASE_URL/{n;s|value: ".*"|value: "https:\/\/'"$CHAT_DOMAIN"'"|;}' infra/k8s/base/chat-service.yaml
          CORS_VALUE="https://$BASE_DOMAIN,https://www.$BASE_DOMAIN"
          sed -Ei '/name: CORS_ALLOWED_ORIGINS/{n;s|value: ".*"|value: "'"$CORS_VALUE"'"|;}' infra/k8s/base/core-api.yaml
          sed -Ei '/name: CORS_ALLOWED_ORIGINS/{n;s|value: ".*"|value: "'"$CORS_VALUE"'"|;}' infra/k8s/base/chat-service.yaml

          awk -v base="$BASE_DOMAIN" -v api="$API_DOMAIN" -v chat="$CHAT_DOMAIN" '
            BEGIN { i = 0 }
            {
              if ($0 ~ /host:/) {
                i++
                if (i == 1) sub(/host: .*/, "host: " base)
                else if (i == 2) sub(/host: .*/, "host: " api)
                else if (i == 3) sub(/host: .*/, "host: " chat)
              }
              print
            }
          ' infra/k8s/base/ingress.yaml > /tmp/ingress.yaml && mv /tmp/ingress.yaml infra/k8s/base/ingress.yaml

          if [ -n "${GITOPS_REPO_URL:-}" ]; then
            sed -Ei "s|repoURL: .*|repoURL: $GITOPS_REPO_URL|" infra/k8s/argocd/application.yaml
          fi

      - name: Commit manifest updates
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add infra/k8s/base/*.yaml infra/k8s/argocd/application.yaml
          git commit -m "chore: update deploy manifests ${{ github.sha }}" || echo "No changes"
          git push

  argocd-sync:
    runs-on: ubuntu-latest
    needs: [preflight, update-k8s-manifests]
    if: needs.preflight.outputs.argocd_enabled == 'true'
    steps:
      - name: ArgoCD app sync
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          ./argocd login $ARGOCD_SERVER --insecure --auth-token $ARGOCD_AUTH_TOKEN
          ./argocd app sync aditi-stays
          ./argocd app wait aditi-stays --health
